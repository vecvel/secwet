# Runs `secwet-relay admin ...` on the production server, e.g. to grant Pro.
# Inputs are checked against strict patterns before anything reaches the
# server; the command runs in a one-off relay container on the private network.
name: "Relay: admin"

on:
  workflow_dispatch:
    inputs:
      command:
        description: Admin command
        type: choice
        options: [status, grant, expire, ungrant, revoke]
        required: true
      workspace:
        description: Workspace (Secwet) UUID
        required: true
      plan:
        description: "grant: plan (pro or free)"
        default: pro
      devices:
        description: "grant: device limit"
        default: "5"
      until:
        description: "grant: expiry date, YYYY-MM-DD (empty for none)"
        default: ""
      device:
        description: "revoke: device id"
        default: ""

permissions:
  contents: read

jobs:
  admin:
    runs-on: ubuntu-latest
    environment: production
    env:
      HOST: ${{ vars.RELAY_HOST }}
      PORT: ${{ vars.SSH_PORT || '22' }}
      COMMAND: ${{ inputs.command }}
      WORKSPACE: ${{ inputs.workspace }}
      PLAN: ${{ inputs.plan }}
      DEVICES: ${{ inputs.devices }}
      UNTIL: ${{ inputs.until }}
      DEVICE: ${{ inputs.device }}
    steps:
      - name: Build the command
        run: |
          uuid='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          [[ "$WORKSPACE" =~ $uuid ]] || { echo "::error::workspace must be a UUID"; exit 1; }
          case "$COMMAND" in
            status|expire|ungrant) args="$COMMAND $WORKSPACE" ;;
            grant)
              [[ "$PLAN" =~ ^(pro|free)$ ]] || { echo "::error::plan must be pro or free"; exit 1; }
              [[ "$DEVICES" =~ ^[0-9]{1,4}$ ]] || { echo "::error::devices must be a number"; exit 1; }
              args="grant $WORKSPACE --plan $PLAN --devices $DEVICES"
              if [ -n "$UNTIL" ]; then
                [[ "$UNTIL" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::until must be YYYY-MM-DD"; exit 1; }
                args="$args --until $UNTIL"
              fi ;;
            revoke)
              [[ "$DEVICE" =~ ^[A-Za-z0-9_-]{1,128}$ ]] || { echo "::error::device id has unexpected characters"; exit 1; }
              args="revoke $WORKSPACE $DEVICE" ;;
            *) echo "::error::unknown command"; exit 1 ;;
          esac
          echo "ARGS=$args" >>"$GITHUB_ENV"

      - name: Run on the server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" >~/.ssh/deploy && chmod 0600 ~/.ssh/deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" >~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -p "$PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes "deploy@$HOST" \
            "cd /opt/secwet && docker compose --env-file .env -f compose.yml run --rm --no-deps -T relay admin $ARGS"
          rm -f ~/.ssh/deploy
