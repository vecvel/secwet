[package]
name = "secwet-desktop"
description = "Secwet desktop app (Tauri 2)."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "secwet_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true
cc = "1.0"

[dependencies]
tauri.workspace = true
serde.workspace = true
serde_json.workspace = true
secwet-app = { workspace = true, features = ["os-keyring"] }
secwet-core = { workspace = true, features = ["test-util"] }
secwet-proto.workspace = true
uuid.workspace = true
tokio = { workspace = true, features = ["time"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"

[dev-dependencies]
tempfile.workspace = true

# Dock icon that follows the system appearance in development builds (src/dock_icon.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData"] }

# Windows Hello for biometric unlock (src/biometric/windows.rs).
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
    "Foundation",
    "Security_Credentials_UI",
    "Win32_Devices_BiometricFramework",
    "Win32_Foundation",
    "Win32_System_WinRT",
] }
windows-future = "0.3.2"
