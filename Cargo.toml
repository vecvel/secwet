[workspace]
resolver = "2"
members = [
    "crates/secwet-proto",
    "crates/secwet-core",
    "crates/secwet-cli",
    "crates/secwet-relay",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
rust-version = "1.90"

[workspace.dependencies]
# Internal workspace crates
secwet-proto = { path = "crates/secwet-proto" }
secwet-core = { path = "crates/secwet-core" }

# Approved Cryptography (docs/IMPLEMENTATION.md §4)
chacha20poly1305 = { version = "0.11.0", features = ["alloc"] }
hkdf = "0.13.0"
sha2 = "0.11.1"
ed25519-dalek = { version = "3.0.0", features = ["rand_core", "zeroize", "serde"] }
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "zeroize", "serde"] }
hpke = { version = "0.14.1", default-features = false, features = ["alloc", "x25519", "chacha"] }
rand_core = "0.10.1"
getrandom = "0.4.3"
zeroize = { version = "1.9.1", features = ["zeroize_derive", "alloc"] }
secrecy = { version = "0.10.3", features = ["serde"] }
subtle = "2.6.1"
postcard = { version = "1.1.3", features = ["alloc", "use-std"] }
keyring = { version = "4.2.0", features = ["v1"] }
data-encoding = { version = "2.11.1", features = ["alloc"] }

# Storage & Platform (docs/IMPLEMENTATION.md §5.1, §5.2)
rusqlite = { version = "0.40.2", features = ["bundled"] }
chrono = { version = "0.4.45", features = ["serde"] }
directories = "6.0.0"
uuid = { version = "1.29.0", features = ["v4", "v7", "serde"] }

# Serialization & Error Handling
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

# Server & Host Frameworks
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "time"] }
axum = "0.8.9"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
governor = "0.8"
# Tauri stays on the latest stable 2.x; 3.0 is still alpha.
tauri = "2"
tauri-build = "2"

# Test Utilities & Property Testing (docs/IMPLEMENTATION.md §11.1)
proptest = "1.12.0"
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
